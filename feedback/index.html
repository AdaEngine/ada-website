<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaEngine Support</title>
    <meta name="description" content="Report bugs and request features for AdaEngine on GitHub Issues." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://github.com/AdaEngine/AdaEngine/issues" />
    <meta http-equiv="refresh" content="0; url=https://github.com/AdaEngine/AdaEngine/issues" />
    <script>
      window.location.replace('https://github.com/AdaEngine/AdaEngine/issues');
    </script>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, system-ui, sans-serif; color: #f4f4f2; background: #111215; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { max-width: 32rem; margin: 1.5rem; padding: 2rem; border: 1px solid #343539; }
      h1 { font-size: 2.6rem; letter-spacing: -.045em; line-height: 1.05; }
      p { color: #a0a1a5; font-size: 1rem; line-height: 1.65; }
      a { display: inline-block; margin-top: 1rem; padding: .9rem 1rem; border: 1px solid #f4f4f2; color: #111215; background: #f4f4f2; text-decoration: none; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      a:hover { background: #d8dce7; }
      a:focus-visible { outline: 2px solid #688bff; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <h1>AdaEngine Support</h1>
      <p>Redirecting you to GitHub Issues to report a bug or request a feature.</p>
      <p><a href="https://github.com/AdaEngine/AdaEngine/issues">Continue to GitHub Issues</a></p>
    </main>
  </body>
</html>
