<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Ada — Game engine built in Swift</title>
  <desc>Ada logo on a dark background with blue and violet light. Open-source game engine built in Swift.</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="40%" r="72%">
      <stop stop-color="#293764"/>
      <stop offset="0.48" stop-color="#171b35"/>
      <stop offset="1" stop-color="#080a10"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#78bbff"/>
      <stop offset="1" stop-color="#a699ff"/>
